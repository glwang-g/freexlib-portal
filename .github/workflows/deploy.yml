name: Deploy freexlib.com portal

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freexlib-portal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/freexlib-portal' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/freexlib_deploy
          chmod 600 ~/.ssh/freexlib_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload portal
        run: |
          set -eu
          remote_dir="/tmp/freexlib-portal-${GITHUB_SHA}"
          ssh -i ~/.ssh/freexlib_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$remote_dir'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/freexlib_deploy -p $DEPLOY_PORT" \
            index.html deploy/nginx/freexlib-portal-static.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"

      - name: Activate portal
        run: |
          set -eu
          remote_dir="/tmp/freexlib-portal-${GITHUB_SHA}"
          ssh -i ~/.ssh/freexlib_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo install -d -m 0755 '$DEPLOY_PATH' && \
             sudo install -m 0644 '$remote_dir/index.html' '$DEPLOY_PATH/index.html' && \
             sudo install -m 0644 '$remote_dir/freexlib-portal-static.conf' /etc/nginx/snippets/freexlib-portal-static.conf && \
             sudo nginx -t && sudo systemctl reload nginx && rm -rf '$remote_dir'"

      - name: Verify production
        run: curl -fsS https://freexlib.com/ | grep -q 'FREEXLIB'
