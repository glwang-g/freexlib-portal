name: Deploy freexlib.com portal

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freexlib-portal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, swarm-space]
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Activate portal
        run: |
          sudo install -d -m 0755 /var/www/freexlib-portal
          sudo install -m 0644 index.html /var/www/freexlib-portal/index.html
          sudo install -m 0644 deploy/nginx/freexlib-portal-static.conf /etc/nginx/snippets/freexlib-portal-static.conf
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Verify production
        run: curl -fsS https://freexlib.com/ | grep -q 'FREEXLIB'
